name: Linux Docker deterministic

on:
  push:
    branches:
      - "impl/pr4-read-write-host-workspace"
      - "tmp/pr9-audit-recovery-20260914"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "agy-bridge.ts"
      - "compose*.yaml"
      - "agents/**"
      - "docker/**"
      - "tests/**"
      - ".github/workflows/linux-docker-deterministic.yml"
      - "docker/tests/**"
      - "docs/docker-compose.md"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "agy-bridge.ts"
      - "compose*.yaml"
      - "agents/**"
      - "docker/**"
      - "tests/**"
      - ".github/workflows/linux-docker-deterministic.yml"
      - "docker/tests/**"
      - "docs/docker-compose.md"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Frozen main runtime commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: agy-bridge-linux-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Resolve exact head and base
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PUSH_REPOSITORY: ${{ github.repository }}
          FROZEN_BASE_REF: 06567660cb765285cf68f28637169c79ddd1aabc
          DISPATCH_HEAD_SHA: ${{ github.sha }}
          DISPATCH_BASE_REF: ${{ inputs.base_ref }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"
            base_ref="$FROZEN_BASE_REF"
            head_repository="$PR_HEAD_REPOSITORY"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            head_sha="$PUSH_HEAD_SHA"
            base_ref="$FROZEN_BASE_REF"
            head_repository="$PUSH_REPOSITORY"
          else
            head_sha="$DISPATCH_HEAD_SHA"
            base_ref="$DISPATCH_BASE_REF"
            head_repository="$DISPATCH_REPOSITORY"
          fi

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid head SHA: $head_sha" >&2
            exit 1
          }
          [[ "$base_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid base SHA: $base_ref" >&2
            exit 1
          }
          [[ -n "$head_repository" ]] || {
            echo "head repository is empty" >&2
            exit 1
          }

          {
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "head_repository=$head_repository"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.refs.outputs.head_repository }}
          ref: ${{ steps.refs.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository identity and PR4 scope
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ steps.refs.outputs.head_sha }}
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
        run: |
          ./docker/tests/assert-pr3-identity.ps1 `
            -ExpectedHead $env:EXPECTED_HEAD `
            -BaseRef $env:BASE_REF

      - name: Apply PR9 finding 4 RED patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr9-finding4.patch <<'PATCH'
          diff --git a/docker/tests/fake-agy.sh b/docker/tests/fake-agy.sh
          --- a/docker/tests/fake-agy.sh
          +++ b/docker/tests/fake-agy.sh
          @@ -30,6 +30,10 @@ input="$(cat || true)"
           printf '%s\n' "$input" > "$capture_file"
           
          +if [[ "$input" == *'FAKE_TOOL_STEP'* ]]; then
          +  printf '%s\n' '{"event":"step_update","step_update":{"step_type":"tool","text_delta":"fake tool activity"}}'
          +fi
          +
           if [[ "$input" == *'FAKE_CREATE_RW_AGENT_COLLISION'* ]]; then
             mkdir -p /workspace/.agents/agents/agy-bridge-worker-rw-v1
             printf '%s\n' 'shadow' > /workspace/.agents/agents/agy-bridge-worker-rw-v1/agent.md
          diff --git a/docker/tests/test-bridge.sh b/docker/tests/test-bridge.sh
          --- a/docker/tests/test-bridge.sh
          +++ b/docker/tests/test-bridge.sh
          @@ -414,10 +414,17 @@ workspace_rw="$(curl -fsS \
             -H 'content-type: application/json' \
             -H "Authorization: Bearer $AGY_TOKEN" \
          -  -d '{"model":"auto-rw-gemini-test","reasoning_effort":"high","messages":[{"role":"user","content":"Modify the caller project."}]}' \
          +  -d '{"model":"auto-rw-gemini-test","reasoning_effort":"high","messages":[{"role":"user","content":"FAKE_TOOL_STEP Modify the caller project."}]}' \
             http://127.0.0.1:17424/v1/chat/completions)"
           [[ "$workspace_rw" == *'fake reply'* ]] || fail "RW deployment auto-rw reply missing"
          +latest_usage="$(tail -n 1 "$STATE_DIR/usage.jsonl")"
          +jq -e '
          +  .autonomous == "rw" and
          +  .agent == "agy-bridge-worker-rw-v1" and
          +  .tool_step_updates == 1
          +' <<<"$latest_usage" >/dev/null || fail "RW native tool-step evidence missing from usage log"
           rw_args="$(cat "$HOME/fake-agy-args.txt")"
           [[ "$rw_args" == *'--agent agy-bridge-worker-rw-v1'* ]] || fail "RW deployment auto-rw did not use reserved RW agent"
           assert_eq "$(cat "$HOME/fake-agy-cwd.txt")" /workspace
          PATCH
          git reset --hard 497ef9a08939835a060e0fe58ebb6f428e9a5dda
          git apply --check /tmp/pr9-finding4.patch
          git apply /tmp/pr9-finding4.patch

      - name: Print Linux, Docker, and commit identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          docker version
          docker info
          docker compose version
          git rev-parse HEAD
          git status --short

          [[ "$(docker info --format '{{.OSType}}')" == "linux" ]] || {
            echo "Docker server OSType is not linux" >&2
            exit 1
          }

          docker_identity="$(
            printf '%s %s' \
              "$(docker info --format '{{.Name}}')" \
              "$(docker info --format '{{.OperatingSystem}}')"
          )"
          if grep -qi 'docker desktop' <<<"$docker_identity"; then
            echo "Docker Desktop is not accepted as Linux Docker Engine evidence: $docker_identity" >&2
            exit 1
          fi

      - name: Build deterministic test image
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test build test

      - name: Run Docker deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm \
            -v "$PWD/docker/tests:/app/docker/tests:ro" \
            -v "$PWD/docs/docker-compose.md:/app/docs/docker-compose.md:ro" \
            test bash /app/docker/tests/run.sh

      - name: Run Deno lint in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            test deno lint

      - name: Run full Deno test suite in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile test run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            test deno task test

      - name: Clean isolated Compose state
        if: always()
        shell: bash
        run: |
          docker compose --profile test down -v --remove-orphans
