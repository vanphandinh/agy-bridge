name: Temporary PR3 formatter

on:
  push:
    branches:
      - tmp/pr3-format

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Format bridge only
        shell: bash
        run: |
          set -euo pipefail
          deno fmt agy-bridge.ts
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "agy-bridge.ts" || { echo "unexpected files changed: $changed" >&2; exit 1; }
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agy-bridge.ts
          git commit -m 'temp: format PR3 runtime [format-applied]'
          git push origin HEAD:tmp/pr3-format
